# LUNAR config patched for KIF apple-to-apple dual-metric evaluation.
# Main model: meta-llama/Llama-3.1-8B base, not Instruct.

# -----------------------------
# Model
# -----------------------------
model_family: llama31-8b-base
base_model_path: meta-llama/Llama-3.1-8B
model_path: ${base_model_path}

# -----------------------------
# Data
# -----------------------------
data_name: kif_entities
forget_edge: ['Taylor_Swift']
use_different_retain_dataset: false
different_retain_set_path: dataset/unlearning/factual_data.json

# -----------------------------
# Unlearning knobs
# -----------------------------
layer_modified: [22]
coeff_list: [+2.0]
use_harmful: false
use_unverified: true
num_epochs: 20
lr: 0.01
positions: -1
n_train: 128
n_test: 100
n_val: 32
max_new_tokens: 64

# -----------------------------
# Evaluation
# -----------------------------
eval_batch_size: 8
eval_generation_max_length: 512
eval_generation_max_new_tokens: 128
if_eval_factual: false
factual_data_path: dataset/unlearning/factual_data.json
compute_es_score: false
# For apple-to-apple KIF comparison, native LUNAR ROUGE eval is optional.
# The main result should come from KIF Module 8 dual metrics.
skip_native_eval: true

# -----------------------------
# Save logging
# -----------------------------
save_unlearned_model: true
save_unlearned_model_path: models_lunar/${data_name}/${model_family}/${forget_edge}
save_folder: lunar_kif_dualmetric
save_path: run_results/completions/${model_family}/${save_folder}/${data_name}
